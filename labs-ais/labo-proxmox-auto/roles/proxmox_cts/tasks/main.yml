---
# Contrairement aux VM (clonage d'un modèle cloud-init), un conteneur LXC
# se crée directement à partir d'une archive de template (ostemplate) :
# ce sont deux mécanismes de provisioning distincts côté Proxmox.
- name: Créer chaque conteneur Alpine
  community.proxmox.proxmox:
    api_host: "{{ api_host }}"
    api_user: "{{ api_user }}"
    api_token_id: "{{ api_token_id }}"
    api_token_secret: "{{ api_token_secret }}"
    node: "{{ pve_node }}"
    vmid: "{{ item.vmid }}"
    hostname: "{{ item.name }}"
    ostemplate: "{{ item.ostemplate }}"
    storage: "{{ storage_images }}"
    cores: "{{ item.cores }}"
    memory: "{{ item.memory }}"
    disk: "{{ storage_images }}:{{ item.disk_size }}"
    netif:
      net0: "name=eth0,bridge={{ network_bridge }},ip={{ item.ip }},gw={{ item.gw }}{{ ',tag=' + network_vlan if network_vlan | length > 0 else '' }}"
    unprivileged: true
    onboot: true
    state: present
  loop: "{{ proxmox_cts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Démarrer les conteneurs
  community.proxmox.proxmox:
    api_host: "{{ api_host }}"
    api_user: "{{ api_user }}"
    api_token_id: "{{ api_token_id }}"
    api_token_secret: "{{ api_token_secret }}"
    node: "{{ pve_node }}"
    vmid: "{{ item.vmid }}"
    state: started
  loop: "{{ proxmox_cts }}"
  loop_control:
    label: "{{ item.name }}"
